[project]
name = "pertussis-global-dynamics"
version = "0.1.0"
description = "Reproducible data layer for post-pandemic global pertussis resurgence analysis"
requires-python = ">=3.12"
dependencies = [
  "pandas==3.0.3",
  "numpy==2.4.6",
  "matplotlib==3.10.9",
  "openpyxl==3.1.5",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
  "cmdstanpy==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["script/tests"]
pythonpath = ["script/src"]
